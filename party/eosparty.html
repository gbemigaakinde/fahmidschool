<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fahmid Nursery and Primary School — Graduation Ceremony</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">

<style>
  :root{
    --navy:#0a1a33;
    --deep-blue:#0d2456;
    --ink:#050d1e;
    --blue-mist:#2c4d8c;
    --blue-soft:#4a6fb5;
    --white:#ffffff;
    --line:rgba(255,255,255,0.14);
    --ease:cubic-bezier(.22,.68,.16,1);
    --header-h:64px;
    --ticker-h:46px;
    --progress-h:3px;
    --sidebar-w:clamp(200px,18vw,260px);
    --slide-scale:1;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:var(--ink);
    overflow:hidden;
    font-family:'Inter',sans-serif;
    color:var(--white);
    -webkit-font-smoothing:antialiased;
    touch-action:none;
  }
  h1,h2,h3,.serif{font-family:'Playfair Display',serif;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- ambient background ---------- */
  #ambient{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(44,77,140,0.35), transparent 55%),
      radial-gradient(ellipse at 85% 80%, rgba(13,36,86,0.55), transparent 60%),
      linear-gradient(160deg, var(--ink) 0%, var(--navy) 55%, var(--deep-blue) 100%);
  }
  #particles{position:fixed;inset:0;z-index:1;pointer-events:none;}
  .particle{
    position:absolute;border-radius:50%;
    background:rgba(255,255,255,0.5);
    filter:blur(0.5px);
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translateY(0) translateX(0);opacity:0;}
    10%{opacity:.6;}
    90%{opacity:.4;}
    100%{transform:translateY(-110vh) translateX(20px);opacity:0;}
  }

  /* ---------- start overlay ---------- */
  #startScreen{
    position:fixed;inset:0;z-index:200;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--ink);
    cursor:pointer;
    transition:opacity 1s var(--ease), visibility 1s;
    padding:20px;
  }
  #startScreen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #startScreen img{width:clamp(70px,12vw,120px);height:clamp(70px,12vw,120px);object-fit:contain;margin-bottom:28px;opacity:0;animation:fadeUp 1s var(--ease) .2s forwards;}
  #startScreen h1{font-size:clamp(22px,4vw,46px);font-weight:600;letter-spacing:.5px;opacity:0;animation:fadeUp 1s var(--ease) .5s forwards;text-align:center;padding:0 20px;}
  #startScreen p{margin-top:18px;font-size:clamp(11px,1.4vw,15px);letter-spacing:3px;text-transform:uppercase;color:var(--blue-soft);opacity:0;animation:fadeUp 1s var(--ease) .8s forwards;text-align:center;}
  #startScreen .enter-btn{
    margin-top:36px;padding:14px 34px;border:1px solid var(--line);border-radius:2px;
    font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--white);
    background:transparent;
    opacity:0;animation:fadeUp 1s var(--ease) 1.1s forwards;
    transition:background .4s var(--ease), border-color .4s var(--ease);
  }
  #startScreen:hover .enter-btn{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.4);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- header ---------- */
  #headerBar{
    position:fixed;top:0;left:0;right:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(14px,3vw,32px);
    height:var(--header-h);
  }
  #headerBar .brand-left{display:flex;align-items:center;gap:12px;}
  #headerBar img{height:clamp(28px,4.5vh,40px);width:clamp(28px,4.5vh,40px);object-fit:contain;}
  #headerBar .brand-right{
    font-family:'Playfair Display',serif;font-weight:600;
    font-size:clamp(12px,1.5vw,18px);letter-spacing:.5px;text-align:right;
  }
  #headerBar .brand-right span{display:block;font-family:'Inter',sans-serif;font-weight:400;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--blue-soft);margin-top:2px;}

  #progressTrack{position:fixed;top:var(--header-h);left:0;right:0;height:var(--progress-h);background:rgba(255,255,255,0.08);z-index:39;}
  #progressFill{height:100%;width:0%;background:var(--blue-soft);transition:width .45s var(--ease);}

  /* ---------- main layout ---------- */
  #main{
    position:fixed;
    top:calc(var(--header-h) + var(--progress-h));
    bottom:var(--ticker-h);
    left:0;right:0;
    display:flex;
    z-index:10;
  }
  #stage{
    flex:1;
    min-width:0;
    position:relative;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(10px,2.2vh,24px);
  }
  #stageBox{
    position:relative;
    width:100%;height:100%;
    max-width:100%;max-height:100%;
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,0.5), inset 0 0 0 1px var(--line);
    background:linear-gradient(155deg, var(--deep-blue) 0%, var(--navy) 100%);
  }

  .slide{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    opacity:0;transform:translateX(0);
    transition:opacity .48s var(--ease), transform .48s var(--ease);
  }
  .slide.slide-from-right{transform:translateX(4%);opacity:0;}
  .slide.slide-from-left{transform:translateX(-4%);opacity:0;}
  .slide.slide-to-left{transform:translateX(-4%)!important;opacity:0!important;}
  .slide.slide-to-right{transform:translateX(4%)!important;opacity:0!important;}
  .slide.active{opacity:1;transform:translateX(0);}

  .slide-inner{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(var(--slide-scale)*46px) calc(var(--slide-scale)*60px);
    position:relative;text-align:center;
    overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
    min-height:0;gap:2px;
  }
  .slide-inner::-webkit-scrollbar{display:none;}

  .slide-tag{
    position:absolute;top:calc(var(--slide-scale)*22px);left:calc(var(--slide-scale)*30px);
    font-size:clamp(8px,calc(var(--slide-scale)*11px),13px);letter-spacing:2.5px;text-transform:uppercase;color:var(--blue-soft);
    max-width:60%;line-height:1.4;text-align:left;
  }
  .slide-num{
    position:absolute;bottom:calc(var(--slide-scale)*18px);right:calc(var(--slide-scale)*24px);
    font-size:clamp(8px,calc(var(--slide-scale)*11px),13px);color:var(--blue-soft);letter-spacing:1px;
  }

  .eyebrow{font-size:clamp(9px,calc(var(--slide-scale)*13px),16px);letter-spacing:3.5px;text-transform:uppercase;color:var(--blue-soft);margin-bottom:calc(var(--slide-scale)*16px);}
  .title-lg{font-size:clamp(19px,calc(var(--slide-scale)*50px),58px);font-weight:600;line-height:1.15;margin-bottom:calc(var(--slide-scale)*12px);}
  .title-md{font-size:clamp(16px,calc(var(--slide-scale)*30px),36px);font-weight:600;margin-bottom:calc(var(--slide-scale)*10px);}
  .subtitle{font-size:clamp(11.5px,calc(var(--slide-scale)*17px),19px);color:rgba(255,255,255,0.72);max-width:80%;line-height:1.6;font-weight:300;}
  .accent-line{width:calc(var(--slide-scale)*48px);height:2px;background:var(--blue-soft);margin:calc(var(--slide-scale)*18px) auto;flex-shrink:0;}

  .reveal{opacity:0;transform:translateY(20px);transition:opacity .8s var(--ease), transform .8s var(--ease);}
  .slide.active .reveal{opacity:1;transform:translateY(0);}
  .slide.active .reveal.d1{transition-delay:.12s;}
  .slide.active .reveal.d2{transition-delay:.26s;}
  .slide.active .reveal.d3{transition-delay:.4s;}
  .zoom-in{opacity:0;transform:scale(.9);transition:opacity .9s var(--ease), transform .9s var(--ease);}
  .slide.active .zoom-in{opacity:1;transform:scale(1);}

  .hw-line{display:block;}
  .hw-char{display:inline-block;opacity:0;filter:blur(2px);animation:hwIn .5s var(--ease) forwards;}
  @keyframes hwIn{to{opacity:1;filter:blur(0);}}
  .arabic{font-family:'Amiri',serif;direction:rtl;font-size:clamp(14px,calc(var(--slide-scale)*30px),34px);line-height:1.75;color:var(--white);}
  .translation{font-style:italic;font-weight:300;color:rgba(255,255,255,0.75);font-size:clamp(11px,calc(var(--slide-scale)*16px),18px);max-width:80%;margin-top:calc(var(--slide-scale)*14px);line-height:1.6;opacity:0;transition:opacity 1.2s var(--ease);}
  .translation.show{opacity:1;}
  .verse-ref{margin-top:calc(var(--slide-scale)*10px);font-size:clamp(9px,calc(var(--slide-scale)*11px),12px);letter-spacing:3px;text-transform:uppercase;color:var(--blue-soft);}

  .med-icon{width:calc(var(--slide-scale)*90px);height:calc(var(--slide-scale)*90px);border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:calc(var(--slide-scale)*22px);flex-shrink:0;}
  .med-icon i{font-size:calc(var(--slide-scale)*38px);color:var(--white);}

  .robot-stage{position:relative;width:calc(var(--slide-scale)*260px);height:calc(var(--slide-scale)*300px);margin:0 auto calc(var(--slide-scale)*30px);flex-shrink:0;}
  .robot{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:calc(var(--slide-scale)*150px);animation:robotBob 2.6s ease-in-out infinite;}
  @keyframes robotBob{
    0%,100%{transform:translateX(-50%) translateY(0) rotate(0deg);}
    50%{transform:translateX(-50%) translateY(-8px) rotate(1.2deg);}
  }
  .r-head{width:calc(var(--slide-scale)*96px);height:calc(var(--slide-scale)*80px);background:var(--white);border-radius:18px;margin:0 auto;position:relative;transform-origin:50% 100%;animation:robotHead 4.5s ease-in-out infinite;}
  @keyframes robotHead{0%,80%,100%{transform:rotate(0);}85%{transform:rotate(-8deg);}92%{transform:rotate(8deg);}}
  .r-eye{position:absolute;top:calc(var(--slide-scale)*30px);width:calc(var(--slide-scale)*14px);height:calc(var(--slide-scale)*14px);border-radius:50%;background:var(--navy);animation:robotBlink 3.6s infinite;}
  .r-eye.l{left:calc(var(--slide-scale)*22px);} .r-eye.r{right:calc(var(--slide-scale)*22px);}
  @keyframes robotBlink{0%,92%,100%{transform:scaleY(1);}94%,97%{transform:scaleY(.1);}}
  .r-antenna{position:absolute;top:calc(var(--slide-scale)*-16px);left:50%;transform:translateX(-50%);width:calc(var(--slide-scale)*4px);height:calc(var(--slide-scale)*16px);background:var(--blue-soft);}
  .r-antenna::after{content:"";position:absolute;top:calc(var(--slide-scale)*-6px);left:calc(var(--slide-scale)*-3px);width:calc(var(--slide-scale)*10px);height:calc(var(--slide-scale)*10px);border-radius:50%;background:var(--blue-soft);}
  .r-body{width:calc(var(--slide-scale)*120px);height:calc(var(--slide-scale)*110px);background:var(--white);border-radius:22px;margin:calc(var(--slide-scale)*6px) auto 0;position:relative;}
  .r-screen{position:absolute;top:calc(var(--slide-scale)*20px);left:50%;transform:translateX(-50%);width:calc(var(--slide-scale)*70px);height:calc(var(--slide-scale)*40px);border-radius:8px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:clamp(8px,calc(var(--slide-scale)*11px),12px);color:#7fd0ff;}
  .r-arm{position:absolute;top:calc(var(--slide-scale)*14px);width:calc(var(--slide-scale)*14px);height:calc(var(--slide-scale)*56px);background:var(--white);border-radius:10px;transform-origin:top center;}
  .r-arm.left{left:calc(var(--slide-scale)*-10px);animation:leftArmCycle 6s ease-in-out infinite;}
  .r-arm.right{right:calc(var(--slide-scale)*-10px);animation:typeArm 1.1s ease-in-out infinite .55s;}
  @keyframes typeArm{
    0%,100%{transform:rotate(-6deg);}
    50%{transform:rotate(16deg);}
  }
  @keyframes leftArmCycle{
    0%{transform:rotate(-6deg);}
    4%{transform:rotate(16deg);}
    9%{transform:rotate(-6deg);}
    13%{transform:rotate(16deg);}
    18%{transform:rotate(-6deg);}
    68%{transform:rotate(-6deg);}
    76%{transform:rotate(-155deg);}
    82%{transform:rotate(-115deg);}
    88%{transform:rotate(-155deg);}
    94%,100%{transform:rotate(-6deg);}
  }
  .r-keyboard{
    position:absolute;
    bottom:calc(var(--slide-scale)*-8px);
    left:50%;transform:translateX(-50%);
    width:calc(var(--slide-scale)*104px);
    height:calc(var(--slide-scale)*16px);
    background:rgba(255,255,255,0.14);
    border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    gap:calc(var(--slide-scale)*5px);
    z-index:1;
  }
  .r-keyboard span{
    width:calc(var(--slide-scale)*11px);
    height:calc(var(--slide-scale)*8px);
    background:rgba(255,255,255,0.6);
    border-radius:2px;
  }
  .r-leg{position:absolute;bottom:calc(var(--slide-scale)*-40px);width:calc(var(--slide-scale)*16px);height:calc(var(--slide-scale)*40px);background:var(--white);border-radius:6px;}
  .r-leg.left{left:calc(var(--slide-scale)*24px);} .r-leg.right{right:calc(var(--slide-scale)*24px);}

  .debate-wrap{display:flex;width:100%;height:100%;}
  .debate-side{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:16px;}
  .debate-side.garri{background:linear-gradient(180deg, rgba(44,77,140,0.25), transparent);}
  .debate-side.rice{background:linear-gradient(180deg, rgba(13,36,86,0.4), transparent);}
  .debate-vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--slide-scale)*58px);height:calc(var(--slide-scale)*58px);border-radius:50%;background:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(10px,calc(var(--slide-scale)*15px),16px);z-index:2;}
  .debate-divider{width:1px;background:var(--line);}

  .prog-list{list-style:none;text-align:left;max-width:80%;width:100%;}
  .prog-list li{display:flex;align-items:baseline;gap:14px;padding:calc(var(--slide-scale)*8px) 0;border-bottom:1px solid var(--line);font-size:clamp(10px,calc(var(--slide-scale)*14px),15px);font-weight:300;}
  .prog-list li span.n{font-family:'Playfair Display',serif;color:var(--blue-soft);font-size:12px;min-width:20px;flex-shrink:0;}

  /* ---------- nav buttons ---------- */
  .navBtn{
    position:absolute;top:50%;transform:translateY(-50%);
    width:44px;height:44px;border-radius:50%;
    background:rgba(5,13,30,0.55);border:1px solid var(--line);color:var(--white);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;opacity:.55;
    transition:opacity .3s var(--ease), background .3s var(--ease);
    z-index:20;
  }
  .navBtn:hover{opacity:1;background:rgba(5,13,30,0.85);}
  .navBtn:disabled{opacity:.15;pointer-events:none;}
  #prevBtn{left:14px;}
  #nextBtn{right:14px;}

  /* ---------- sidebar ---------- */
  #sidebar{
    width:var(--sidebar-w);flex-shrink:0;
    display:flex;flex-direction:column;
    padding:18px 14px 14px;
    border-left:1px solid var(--line);
    overflow:hidden;
  }
  #sidebar .sb-heading{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--blue-soft);margin-bottom:12px;padding:0 4px;}
  #sidebarList{display:flex;flex-direction:column;gap:8px;overflow:hidden;}
  .upnext-card{
    display:flex;align-items:center;gap:10px;
    padding:10px 10px;border-radius:5px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    text-align:left;
    transition:background .25s var(--ease), border-color .25s var(--ease), transform .25s var(--ease);
  }
  .upnext-card:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.3);transform:translateX(-2px);}
  .upnext-card .un-n{font-family:'Playfair Display',serif;color:var(--blue-soft);font-size:12px;min-width:18px;flex-shrink:0;}
  .upnext-card .un-tag{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue-soft);margin-bottom:2px;}
  .upnext-card .un-title{font-size:12px;line-height:1.35;color:rgba(255,255,255,0.85);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .upnext-card.next-up{border-color:rgba(255,255,255,0.35);background:rgba(255,255,255,0.05);}
  #sidebarEnd{margin-top:auto;padding:10px 4px 0;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.3);}

  /* ---------- ticker ---------- */
  #ticker{
    position:fixed;bottom:0;left:0;right:0;height:var(--ticker-h);z-index:50;
    background:rgba(5,13,30,0.92);border-top:1px solid var(--line);
    display:flex;align-items:stretch;backdrop-filter:blur(6px);
  }
  #ticker .news-label{
    display:flex;align-items:center;padding:0 clamp(12px,2.5vw,20px);background:var(--blue-mist);
    font-size:10.5px;letter-spacing:3px;font-weight:700;white-space:nowrap;
  }
  #ticker .ticker-track-wrap{flex:1;overflow:hidden;display:flex;align-items:center;}
  #ticker .ticker-track{display:flex;white-space:nowrap;animation:tickerScroll 110s linear infinite;}
  #ticker .ticker-item{padding:0 clamp(18px,3vw,40px);font-size:clamp(10.5px,1.2vw,13px);font-weight:300;letter-spacing:.3px;color:rgba(255,255,255,0.88);position:relative;}
  #ticker .ticker-item::after{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:var(--blue-soft);}
  @keyframes tickerScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  #ticker .clock{
    display:flex;align-items:center;padding:0 clamp(12px,2vw,22px);font-variant-numeric:tabular-nums;
    font-size:clamp(10.5px,1.2vw,13px);letter-spacing:1px;border-left:1px solid var(--line);white-space:nowrap;
  }

  #navHint{
    position:fixed;top:calc(var(--header-h) + 14px);left:50%;transform:translateX(-50%);z-index:41;
    font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.45);
    display:flex;gap:8px;align-items:center;transition:opacity .8s var(--ease);
    white-space:nowrap;pointer-events:none;
  }
  #navHint.fade{opacity:0;}

  /* ---------- responsive ---------- */
  @media (max-width: 900px){
    #sidebar{display:none;}
  }
  @media (max-width: 640px){
    :root{ --header-h:52px; --ticker-h:38px; }
    #headerBar .brand-right span{display:none;}
    #headerBar .brand-right{font-size:12px;}
    .navBtn{width:36px;height:36px;font-size:15px;}
    #navHint{font-size:9px;top:calc(var(--header-h) + 10px);}
    .debate-wrap{flex-direction:column;}
    .debate-divider{width:100%;height:1px;}
    #ticker .news-label{font-size:9px;padding:0 10px;}
  }
  @media (max-height: 480px){
    :root{ --header-h:44px; --ticker-h:0px; }
    #ticker{display:none;}
    #navHint{display:none;}
  }
</style>
</head>
<body>

<div id="ambient"></div>
<div id="particles"></div>

<div id="startScreen">
  <img src="IMG_4629.png" alt="School logo">
  <h1 class="serif">Fahmid Nursery and Primary School</h1>
  <p>End of Session &amp; Graduation Ceremony</p>
  <div class="enter-btn">Tap to Begin</div>
</div>

<div id="headerBar">
  <div class="brand-left">
    <img src="IMG_4629.png" alt="Fahmid logo">
  </div>
  <div class="brand-right serif">
    Fahmid Nursery and Primary School
    <span id="liveSection">Graduation Ceremony</span>
  </div>
</div>
<div id="progressTrack"><div id="progressFill"></div></div>

<div id="navHint"><i class="ph ph-caret-left"></i> arrow keys or swipe to move <i class="ph ph-caret-right"></i></div>

<div id="main">
  <div id="stage">
    <button id="prevBtn" class="navBtn" aria-label="Previous slide"><i class="ph-bold ph-caret-left"></i></button>
    <div id="stageBox"></div>
    <button id="nextBtn" class="navBtn" aria-label="Next slide"><i class="ph-bold ph-caret-right"></i></button>
  </div>
  <div id="sidebar">
    <div class="sb-heading">Up Next</div>
    <div id="sidebarList"></div>
    <div id="sidebarEnd"></div>
  </div>
</div>

<div id="ticker">
  <div class="news-label">NEWS</div>
  <div class="ticker-track-wrap">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>
  <div class="clock" id="clock">--:--</div>
</div>

<script>
/* ============================================================
   0. PARTICLES
============================================================ */
(function particles(){
  const box = document.getElementById('particles');
  const count = 30;

/* ============================================================
   5. DYNAMIC TEXT ANIMATIONS
============================================================ */
function runHandwriting(el){
  const quran = el.querySelector('[data-hw]');
  if(quran){
    const text = decodeURIComponent(quran.dataset.hw);
    quran.innerHTML = makeHandwriting(text);
    const trEl = el.querySelector('[data-tr]');
    if(trEl){
      trEl.textContent = decodeURIComponent(trEl.dataset.tr);
      setTimeout(() => trEl.classList.add('show'), 1300);
    }
  }
  el.querySelectorAll('[data-hw2]').forEach((node) => {
    node.innerHTML = makeHandwriting(decodeURIComponent(node.dataset.hw2));
  });
}
function runAnthemLines(el){
  const lines = el.querySelectorAll('[data-hw3]');
  let cumulative = 0;
  lines.forEach((node) => {
    const text = node.dataset.hw3;
    setTimeout(() => { node.innerHTML = makeHandwriting(text); }, cumulative);
    cumulative += text.length*16 + 200;
  });
}

/* ============================================================
   6. SLIDE ENGINE (single slide at a time, cross-fade transition)
============================================================ */
const stageBoxEl = document.getElementById('stageBox');
const sidebarListEl = document.getElementById('sidebarList');
const sidebarEndEl = document.getElementById('sidebarEnd');
const progressFillEl = document.getElementById('progressFill');
const liveSectionEl = document.getElementById('liveSection');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const navHintEl = document.getElementById('navHint');

let current = 0;
let animating = false;
let robotScreenInterval = null;
const TRANS_MS = 480;

function buildSlideNode(index){
  const p = pages[index];
  const div = document.createElement('div');
  div.className = 'slide';
  div.innerHTML = renderPage(p) + `<div class="slide-num">${index+1} / ${pages.length}</div>`;
  return div;
}

function startRobotScreen(node){
  const screenEl = node.querySelector('#robotScreen');
  if(!screenEl) return;
  const frames = ['</>','01','10','{ }','OK','AI','>_'];
  let i = 0;
  screenEl.textContent = frames[0];
  robotScreenInterval = setInterval(() => {
    i = (i+1) % frames.length;
    screenEl.textContent = frames[i];
  }, 900);
}

function showSlide(newIndex, opts){
  newIndex = Math.max(0, Math.min(pages.length-1, newIndex));
  if(newIndex === current && stageBoxEl.children.length) return;
  if(animating) return;

  const instant = !!(opts && opts.instant);
  const direction = newIndex > current ? 1 : -1;
  const old = stageBoxEl.querySelector('.slide.active') || stageBoxEl.querySelector('.slide');

  if(robotScreenInterval){ clearInterval(robotScreenInterval); robotScreenInterval = null; }

  animating = !instant;

  const newNode = buildSlideNode(newIndex);
  if(!instant){
    newNode.classList.add(direction > 0 ? 'slide-from-right' : 'slide-from-left');
  }
  stageBoxEl.appendChild(newNode);
  void newNode.offsetWidth;

  if(old && !instant){
    old.classList.add(direction > 0 ? 'slide-to-left' : 'slide-to-right');
    setTimeout(() => { if(old.parentNode) old.remove(); animating = false; }, TRANS_MS + 40);
  }else if(old){
    old.remove();
  }else{
    animating = false;
  }

  requestAnimationFrame(() => {
    newNode.classList.remove('slide-from-right','slide-from-left');
    newNode.classList.add('active');
  });

  current = newIndex;
  const p = pages[current];
  runHandwriting(newNode);
  if(p.layout === 'anthemStanza') runAnthemLines(newNode);
  if(p.layout === 'robot') startRobotScreen(newNode);
  if(p.section) liveSectionEl.textContent = p.section;

  progressFillEl.style.width = ((current+1)/pages.length*100).toFixed(2)+'%';
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === pages.length-1;
  renderSidebar();
  fadeNavHint();
}

function renderSidebar(){
  const upcoming = [];
  for(let i=current+1; i<pages.length && upcoming.length<5; i++){ upcoming.push(i); }
  sidebarListEl.innerHTML = upcoming.map((idx,pos) => `
    <button class="upnext-card ${pos===0?'next-up':''}" data-index="${idx}">
      <span class="un-n">${idx+1}</span>
      <span class="un-text">
        <span class="un-tag">${esc((pages[idx].tag||'').split('·')[0].trim())}</span>
        <span class="un-title">${esc(pages[idx].navLabel)}</span>
      </span>
    </button>
  `).join('');
  sidebarEndEl.textContent = upcoming.length ? '' : 'Final slide';
  sidebarListEl.querySelectorAll('.upnext-card').forEach(btn=>{
    btn.addEventListener('click', () => {
      if(animating) return;
      showSlide(parseInt(btn.dataset.index,10));
    });
  });
}

function fadeNavHint(){
  navHintEl.classList.add('fade');
}

function goNext(){ showSlide(current+1); }
function goPrev(){ showSlide(current-1); }

prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);

/* ============================================================
   7. STAGE FIT — keeps every slide at a fixed 16:9 shape,
      scaled to whatever screen/projector it's shown on.
============================================================ */
const stageEl = document.getElementById('stage');
function fitStage(){
  const pad = 0;
  let availW = stageEl.clientWidth - pad;
  let availH = stageEl.clientHeight - pad;
  if(availW < 40) availW = 40;
  if(availH < 40) availH = 40;
  const ratio = 16/9;
  let w = availW, h = w/ratio;
  if(h > availH){ h = availH; w = h*ratio; }
  stageBoxEl.style.width = w+'px';
  stageBoxEl.style.height = h+'px';
  const scale = h/540;
  document.documentElement.style.setProperty('--slide-scale', scale.toFixed(4));
}

if('ResizeObserver' in window){
  new ResizeObserver(fitStage).observe(stageEl);
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', () => setTimeout(fitStage,150));
document.addEventListener('fullscreenchange', () => setTimeout(fitStage,150));

/* ============================================================
   8. KEYBOARD + SWIPE
============================================================ */
window.addEventListener('keydown', (e) => {
  if(!startScreen.classList.contains('hidden')) return;
  if(e.key === 'ArrowRight' || e.key === ' ') goNext();
  if(e.key === 'ArrowLeft') goPrev();
});

let touchStartX = null, touchStartY = null;
stageEl.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
stageEl.addEventListener('touchend', (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.4){
    dx < 0 ? goNext() : goPrev();
  }
  touchStartX = null; touchStartY = null;
}, {passive:true});

/* ============================================================
   9. INIT
============================================================ */
window.addEventListener('load', () => {
  fitStage();
  showSlide(0, {instant:true});
});
</script>
