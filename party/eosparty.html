<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fahmid Nursery and Primary School — Graduation Ceremony</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">

<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<style>
  :root{
    --navy:#0a1a33;
    --deep-blue:#0d2456;
    --ink:#050d1e;
    --blue-mist:#2c4d8c;
    --blue-soft:#4a6fb5;
    --paper:#f6f8fc;
    --white:#ffffff;
    --line:rgba(255,255,255,0.14);
    --line-dark:rgba(10,26,51,0.12);
    --ease:cubic-bezier(.22,.68,.16,1);
    --ticker-h:52px;
    --header-h:88px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:var(--ink);
    overflow:hidden;
    font-family:'Inter',sans-serif;
    color:var(--white);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Playfair Display',serif;}

  /* ---------- ambient background ---------- */
  #ambient{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(44,77,140,0.35), transparent 55%),
      radial-gradient(ellipse at 85% 80%, rgba(13,36,86,0.55), transparent 60%),
      linear-gradient(160deg, var(--ink) 0%, var(--navy) 55%, var(--deep-blue) 100%);
  }
  #particles{position:fixed;inset:0;z-index:1;pointer-events:none;}
  .particle{
    position:absolute;border-radius:50%;
    background:rgba(255,255,255,0.5);
    filter:blur(0.5px);
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translateY(0) translateX(0);opacity:0;}
    10%{opacity:.6;}
    90%{opacity:.4;}
    100%{transform:translateY(-110vh) translateX(20px);opacity:0;}
  }

  /* ---------- start overlay ---------- */
  #startScreen{
    position:fixed;inset:0;z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--ink);
    cursor:pointer;
    transition:opacity 1s var(--ease), visibility 1s;
    padding:20px;
  }
  #startScreen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #startScreen img{width:clamp(70px,12vw,120px);height:clamp(70px,12vw,120px);object-fit:contain;margin-bottom:28px;opacity:0;animation:fadeUp 1s var(--ease) .2s forwards;}
  #startScreen h1{font-size:clamp(22px,4vw,46px);font-weight:600;letter-spacing:.5px;opacity:0;animation:fadeUp 1s var(--ease) .5s forwards;text-align:center;padding:0 20px;}
  #startScreen p{margin-top:18px;font-size:clamp(11px,1.4vw,15px);letter-spacing:3px;text-transform:uppercase;color:var(--blue-soft);opacity:0;animation:fadeUp 1s var(--ease) .8s forwards;text-align:center;}
  #startScreen .enter-btn{
    margin-top:36px;padding:14px 34px;border:1px solid var(--line);border-radius:2px;
    font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--white);
    opacity:0;animation:fadeUp 1s var(--ease) 1.1s forwards;
    transition:background .4s var(--ease), border-color .4s var(--ease);
  }
  #startScreen:hover .enter-btn{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.4);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- header ---------- */
  #headerBar{
    position:fixed;top:0;left:0;right:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:clamp(10px,2vh,22px) clamp(14px,4vw,40px);
    pointer-events:none;
    height:var(--header-h);
  }
  #headerBar .brand-left{display:flex;align-items:center;gap:14px;}
  #headerBar img{height:clamp(30px,5vh,46px);width:clamp(30px,5vh,46px);object-fit:contain;}
  #headerBar .brand-right{
    font-family:'Playfair Display',serif;font-weight:600;
    font-size:clamp(12px,1.6vw,19px);letter-spacing:.5px;text-align:right;
  }
  #headerBar .brand-right span{display:block;font-family:'Inter',sans-serif;font-weight:400;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--blue-soft);margin-top:3px;}
  .hairline{position:fixed;top:var(--header-h);left:clamp(14px,4vw,40px);right:clamp(14px,4vw,40px);height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);z-index:39;}

  /* ---------- book ---------- */
  #bookWrap{
    position:fixed;
    top:var(--header-h);
    bottom:var(--ticker-h);
    left:0;right:0;
    z-index:10;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(10px,2.5vh,28px) clamp(12px,3vw,40px);
    overflow:hidden;
  }
  #book{width:100%;height:100%;max-width:1400px;}
  .page{
    background:linear-gradient(155deg, var(--deep-blue) 0%, var(--navy) 100%);
    display:flex;flex-direction:column;
    overflow:hidden;position:relative;
    box-shadow:inset 0 0 0 1px var(--line);
    opacity:1;
    transition:opacity .6s var(--ease);
  }
  .page.dimmed{opacity:0.14;}
  .page.focused{opacity:1;}
  .page-inner{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(34px,7vh,60px) clamp(18px,6vw,70px);
    position:relative;text-align:center;
    overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
    min-height:0;
    gap:2px;
  }
  .page-tag{
    position:absolute;top:clamp(12px,3vh,28px);left:clamp(14px,3vw,36px);
    font-size:clamp(9px,1.1vw,11px);letter-spacing:2.5px;text-transform:uppercase;color:var(--blue-soft);
    max-width:70%;line-height:1.4;
  }
  .page-num{position:absolute;bottom:clamp(10px,2vh,22px);right:clamp(12px,2.5vw,30px);font-size:clamp(9px,1.1vw,11px);color:var(--blue-soft);letter-spacing:1px;}

  .eyebrow{font-size:clamp(10px,1.3vw,12px);letter-spacing:3.5px;text-transform:uppercase;color:var(--blue-soft);margin-bottom:clamp(10px,2vh,18px);}
  .title-lg{font-size:clamp(22px,4.4vw,56px);font-weight:600;line-height:1.15;margin-bottom:14px;}
  .title-md{font-size:clamp(18px,3vw,34px);font-weight:600;margin-bottom:12px;}
  .subtitle{font-size:clamp(12.5px,1.5vw,18px);color:rgba(255,255,255,0.72);max-width:640px;line-height:1.6;font-weight:300;}
  .accent-line{width:48px;height:2px;background:var(--blue-soft);margin:clamp(14px,2.5vh,22px) auto;flex-shrink:0;}

  /* reveal-on-enter utility, triggered by JS when a page becomes active */
  .reveal{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease), transform .9s var(--ease);}
  .page.active .reveal{opacity:1;transform:translateY(0);}
  .page.active .reveal.d1{transition-delay:.15s;}
  .page.active .reveal.d2{transition-delay:.32s;}
  .page.active .reveal.d3{transition-delay:.5s;}
  .page.active .reveal.d4{transition-delay:.68s;}
  .zoom-in{opacity:0;transform:scale(.9);transition:opacity 1s var(--ease), transform 1s var(--ease);}
  .page.active .zoom-in{opacity:1;transform:scale(1);}

  /* ---------- handwriting reveal ---------- */
  .hw-line{display:block;}
  .hw-char{display:inline-block;opacity:0;filter:blur(2px);animation:hwIn .5s var(--ease) forwards;}
  @keyframes hwIn{to{opacity:1;filter:blur(0);}}
  .arabic{font-family:'Amiri',serif;direction:rtl;font-size:clamp(16px,2.6vw,32px);line-height:1.75;color:var(--white);}
  .translation{font-style:italic;font-weight:300;color:rgba(255,255,255,0.75);font-size:clamp(12px,1.4vw,17px);max-width:640px;margin-top:14px;line-height:1.6;opacity:0;transition:opacity 1.2s var(--ease);}
  .translation.show{opacity:1;}
  .verse-ref{margin-top:10px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--blue-soft);}

  /* ---------- ticker ---------- */
  #ticker{
    position:fixed;bottom:0;left:0;right:0;height:var(--ticker-h);z-index:50;
    background:rgba(5,13,30,0.92);border-top:1px solid var(--line);
    display:flex;align-items:stretch;backdrop-filter:blur(6px);
  }
  #ticker .news-label{
    display:flex;align-items:center;padding:0 clamp(12px,2.5vw,22px);background:var(--blue-mist);
    font-size:11px;letter-spacing:3px;font-weight:700;white-space:nowrap;
  }
  #ticker .ticker-track-wrap{flex:1;overflow:hidden;display:flex;align-items:center;}
  #ticker .ticker-track{display:flex;white-space:nowrap;animation:tickerScroll 110s linear infinite;}
  #ticker .ticker-item{padding:0 clamp(20px,3.5vw,46px);font-size:clamp(11px,1.3vw,13.5px);font-weight:300;letter-spacing:.3px;color:rgba(255,255,255,0.88);position:relative;}
  #ticker .ticker-item::after{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:var(--blue-soft);}
  @keyframes tickerScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  #ticker .clock{
    display:flex;align-items:center;padding:0 clamp(12px,2vw,24px);font-variant-numeric:tabular-nums;
    font-size:clamp(11px,1.3vw,14px);letter-spacing:1px;border-left:1px solid var(--line);white-space:nowrap;
  }

  /* ---------- nav hint ---------- */
  #navHint{
    position:fixed;bottom:calc(var(--ticker-h) + 12px);left:50%;transform:translateX(-50%);z-index:41;
    font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.45);
    display:flex;gap:10px;align-items:center;transition:opacity 1s var(--ease);
    white-space:nowrap;
  }
  #navHint.fade{opacity:0;}

  /* ---------- medical slides ---------- */
  .med-icon{width:clamp(58px,10vw,96px);height:clamp(58px,10vw,96px);border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:clamp(14px,2.5vh,26px);flex-shrink:0;}
  .med-icon i{font-size:clamp(26px,4.5vw,42px);color:var(--white);}

  /* ---------- coding robot ---------- */
  .robot-stage{position:relative;width:clamp(150px,22vw,260px);height:clamp(175px,25vw,300px);margin:0 auto clamp(14px,2.5vh,30px);flex-shrink:0;}
  .robot{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:150px;animation:robotBob 2.4s ease-in-out infinite;}
  @keyframes robotBob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-8px);}}
  .r-head{width:64%;height:53%;background:var(--white);border-radius:18px;margin:0 auto;position:relative;transform-origin:50% 100%;animation:robotHead 4.5s ease-in-out infinite;}
  @keyframes robotHead{0%,80%,100%{transform:rotate(0);}85%{transform:rotate(-8deg);}92%{transform:rotate(8deg);}}
  .r-eye{position:absolute;top:38%;width:11%;height:11%;border-radius:50%;background:var(--navy);animation:robotBlink 3.6s infinite;}
  .r-eye.l{left:23%;} .r-eye.r{right:23%;}
  @keyframes robotBlink{0%,92%,100%{transform:scaleY(1);}94%,97%{transform:scaleY(.1);}}
  .r-antenna{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:4px;height:16px;background:var(--blue-soft);}
  .r-antenna::after{content:"";position:absolute;top:-6px;left:-3px;width:10px;height:10px;border-radius:50%;background:var(--blue-soft);}
  .r-body{width:80%;height:73%;background:var(--white);border-radius:22px;margin:6px auto 0;position:relative;}
  .r-screen{position:absolute;top:18%;left:50%;transform:translateX(-50%);width:58%;height:36%;border-radius:8px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:clamp(9px,1.5vw,11px);color:#7fd0ff;}
  .r-arm{position:absolute;top:13%;width:12%;height:50%;background:var(--white);border-radius:10px;transform-origin:top center;}
  .r-arm.left{left:-8%;animation:armWave 2.4s ease-in-out infinite;}
  .r-arm.right{right:-8%;}
  @keyframes armWave{0%,60%,100%{transform:rotate(0);}70%{transform:rotate(-35deg);}80%{transform:rotate(-15deg);}90%{transform:rotate(-35deg);}}
  .r-leg{position:absolute;bottom:-13%;width:13%;height:14%;background:var(--white);border-radius:6px;}
  .r-leg.left{left:20%;} .r-leg.right{right:20%;}

  /* ---------- debate split ---------- */
  .debate-wrap{display:flex;width:100%;height:100%;}
  .debate-side{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:16px;}
  .debate-side.garri{background:linear-gradient(180deg, rgba(44,77,140,0.25), transparent);}
  .debate-side.rice{background:linear-gradient(180deg, rgba(13,36,86,0.4), transparent);}
  .debate-vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(44px,7vw,64px);height:clamp(44px,7vw,64px);border-radius:50%;background:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(12px,1.6vw,15px);z-index:2;}
  .debate-divider{width:1px;background:var(--line);}

  /* ---------- program list ---------- */
  .prog-list{list-style:none;text-align:left;max-width:520px;width:100%;}
  .prog-list li{display:flex;align-items:baseline;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:clamp(12px,1.4vw,14px);font-weight:300;}
  .prog-list li span.n{font-family:'Playfair Display',serif;color:var(--blue-soft);font-size:12px;min-width:20px;flex-shrink:0;}

  ::-webkit-scrollbar{display:none;}

  /* ---------- short-viewport (projectors, landscape phones) ---------- */
  @media (max-height: 640px){
    :root{ --header-h:56px; --ticker-h:40px; }
    #headerBar .brand-right span{display:none;}
    .eyebrow{margin-bottom:6px;}
    .accent-line{margin:8px auto;}
    .page-inner{padding-top:clamp(20px,5vh,34px);padding-bottom:clamp(20px,5vh,34px);}
    #navHint{display:none;}
    .robot-stage{height:clamp(120px,20vh,200px);margin-bottom:8px;}
  }

  /* ---------- narrow viewports (phones, iPads in portrait) ---------- */
  @media (max-width: 760px){
    #headerBar .brand-right span{display:none;}
    #headerBar .brand-right{font-size:12px;}
    .debate-wrap{flex-direction:column;}
    .debate-divider{width:100%;height:1px;}
    .debate-vs{position:absolute;}
    #ticker .news-label{font-size:10px;}
    #navHint{display:none;}
  }

  @media (max-width: 480px){
    .title-lg{font-size:clamp(20px,7vw,32px);}
    .title-md{font-size:clamp(16px,6vw,24px);}
    .page-inner{padding-left:16px;padding-right:16px;}
  }
</style>
</head>
<body>

<div id="ambient"></div>
<div id="particles"></div>

<div id="startScreen">
  <img src="IMG_4629.png" alt="School logo">
  <h1 class="serif">Fahmid Nursery and Primary School</h1>
  <p>End of Session &amp; Graduation Ceremony</p>
  <div class="enter-btn">Tap to Begin</div>
</div>

<div id="headerBar">
  <div class="brand-left">
    <img src="IMG_4629.png" alt="Fahmid logo">
  </div>
  <div class="brand-right serif">
    Fahmid Nursery and Primary School
    <span id="liveSection">Graduation Ceremony</span>
  </div>
</div>
<div class="hairline"></div>

<div id="bookWrap">
  <div id="book"></div>
</div>

<div id="navHint"><i class="ph ph-caret-left"></i> use arrow keys or swipe <i class="ph ph-caret-right"></i></div>

<div id="ticker">
  <div class="news-label">NEWS</div>
  <div class="ticker-track-wrap">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>
  <div class="clock" id="clock">--:--</div>
</div>

<script>
/* ============================================================
   0. PARTICLES
============================================================ */
(function particles(){
  const box = document.getElementById('particles');
  const count = 34;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random()*2.4+1;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = Math.random()*100+'vw';
    p.style.bottom = (-10 - Math.random()*20)+'vh';
    p.style.animationDuration = (14 + Math.random()*16)+'s';
    p.style.animationDelay = (Math.random()*16)+'s';
    box.appendChild(p);
  }
})();

/* ============================================================
   1. TICKER + CLOCK
============================================================ */
const newsItems = [
  "Welcome to the Fahmid Nursery and Primary School End of Session and Graduation Ceremony",
  "Congratulations to our graduating class — we're proud of every one of you",
  "Registration for the new session opens next month. Visit the school office for details",
  "Thank you to all parents and guardians for your support this year",
  "Fahmid Nursery and Primary School, Alagbado, Ifako Ijaiye, Lagos",
  "Photography and refreshments are available at the rear of the hall"
];
function buildTicker(){
  const track = document.getElementById('tickerTrack');
  const loopItems = newsItems.concat(newsItems); // duplicate for seamless loop
  track.innerHTML = loopItems.map(t => `<div class="ticker-item">${t}</div>`).join('');
}
buildTicker();

function updateClock(){
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes().toString().padStart(2,'0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h === 0) h = 12;
  document.getElementById('clock').textContent = `${h}:${m} ${ampm}`;
}
updateClock();
setInterval(updateClock, 1000);

/* ============================================================
   2. START SCREEN / FULLSCREEN
============================================================ */
const startScreen = document.getElementById('startScreen');
function enterPresentation(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if(req){ try{ req.call(el); }catch(e){} }
  startScreen.classList.add('hidden');
  startScreen.removeEventListener('click', enterPresentation);
  window.removeEventListener('keydown', keyStart);
  setTimeout(handleDisplayChange, 250);
}
function keyStart(e){ enterPresentation(); }
startScreen.addEventListener('click', enterPresentation);
window.addEventListener('keydown', keyStart, { once:true });

/* ============================================================
   3. PAGE DATA
   layout options: cover, verse, anthemStanza, program, medical, robot, debate, split
============================================================ */
const pages = [];

pages.push({ layout:'cover' });

pages.push({
  layout:'simple', tag:'01 · Opening', section:'Opening Prayer',
  eyebrow:'We Begin', title:'In God\u2019s Name',
  subtitle:'We start the way we always do — with a prayer, and a hope that the evening goes well for everyone here.'
});

pages.push({
  layout:'verseQuran',
  tag:'02 · Holy Book', section:'Recitation of the Holy Book',
  arabic: 'يَا بُنَيَّ أَقِمِ الصَّلَاةَ وَأْمُرْ بِالْمَعْرُوفِ وَانْهَ عَنِ الْمُنكَرِ وَاصْبِرْ عَلَىٰ مَا أَصَابَكَ ۖ إِنَّ ذَٰلِكَ مِنْ عَزْمِ الْأُمُورِ',
  translation:'"O my son, establish prayer, enjoin what is right, forbid what is wrong, and be patient over whatever befalls you. Indeed, that is of the matters requiring determination."',
  ref:'Surah Luqman · 31:17 (Sahih International)'
});

pages.push({
  layout:'verseBible',
  tag:'02 · Holy Book', section:'Recitation of the Holy Book',
  verses:[
    { text:'Unless the LORD builds the house, the builders labor in vain.', ref:'Psalm 127:1' },
    { text:'The LORD bless you and keep you; the LORD make his face shine on you and be gracious to you; the LORD turn his face toward you and give you peace.', ref:'Numbers 6:24–26' }
  ]
});

pages.push({
  layout:'anthemStanza', tag:'03 · National Anthem', section:'National Anthem', title:'First Stanza',
  lines:[
    'Nigeria, we hail thee,',
    'Our own dear native land,',
    'Though tribe and tongue may differ,',
    'In brotherhood, we stand,',
    'Nigerians all, and proud to serve',
    'Our sovereign Motherland.'
  ]
});
pages.push({
  layout:'anthemStanza', tag:'03 · National Anthem', section:'National Anthem', title:'Second Stanza',
  lines:[
    'Our flag shall be a symbol',
    'That truth and justice reign,',
    'In peace or battle, honour\u2019d,',
    'And this we count as gain,',
    'To hand on to our children',
    'A banner without stain.'
  ]
});

pages.push({ layout:'program', tag:'04 · Opening', section:'Welcome Dance', eyebrow:'Rhythm & Colour', title:'Welcome Dance', subtitle:'Our pupils open the show with colour and rhythm.' });

pages.push({ layout:'guests', tag:'05 · Ceremony', section:'Introduction of Guests' });

pages.push({ layout:'program', tag:'06 · Presentation', section:'Knowing Nigeria', eyebrow:'Nursery Presentation', title:'Knowing Nigeria', subtitle:'Our nursery pupils show what they\u2019ve learned about Nigeria. Shown on the hall\u2019s main projector.' });

pages.push({ layout:'medicalIntro' });
// individual medical slides are appended programmatically below

pages.push({ layout:'program', tag:'08 · Language', section:'French Presentation', eyebrow:'Bonjour', title:'French Presentation', subtitle:'A short piece in French — new words, and pronunciation the pupils have been practising for weeks.' });

function makeHandwriting(text, cls){
  let out = '';
  let idx = 0;
  for(const ch of text){
    if(ch === ' '){ out += ' '; continue; }
    const delay = (idx*0.028).toFixed(3);
    out += `<span class="hw-char ${cls||''}" style="animation-delay:${delay}s">${ch}</span>`;
    idx++;
  }
  return out;
}

/* ============================================================
   6. INITIALISE STPAGEFLIP + ONE-SLIDE-AT-A-TIME FOCUS SYSTEM
============================================================ */
let pageFlip;

let focusIndex = 0;
let pendingDirection = null;

function pairOf(idx){
  const start = idx - (idx % 2);
  const partner = (start + 1 < pages.length) ? start + 1 : null;
  return { start, partner };
}

function fadeNavHint(){
  document.getElementById('navHint').classList.add('fade');
}

function applyFocus(){
  const { start, partner } = pairOf(focusIndex);
  const indices = partner !== null ? [start, partner] : [start];

  document.querySelectorAll('.page').forEach(el => el.classList.remove('active','focused','dimmed'));

  let sectionText = null;

  indices.forEach((idx) => {
    const el = document.querySelector(`.page[data-index="${idx}"]`);
    if(!el) return;
    void el.offsetWidth;
    el.classList.add('active');
    el.classList.add(idx === focusIndex ? 'focused' : 'dimmed');

    const p = pages[idx];
    if(p && p.section && idx === focusIndex){ sectionText = p.section; }

    if(!el.dataset.rendered){
      el.dataset.rendered = '1';
      runHandwriting(el);
      if(p && p.layout === 'anthemStanza') runAnthemLines(el);
    }
  });

  if(sectionText){ document.getElementById('liveSection').textContent = sectionText; }
}

function goNext(){
  if(!pageFlip) return;
  const { start, partner } = pairOf(focusIndex);
  if(focusIndex === start && partner !== null){
    focusIndex = partner;
    applyFocus();
  }else{
    pendingDirection = 'next';
    pageFlip.flipNext();
  }
  fadeNavHint();
}

function goPrev(){
  if(!pageFlip) return;
  const { start, partner } = pairOf(focusIndex);
  if(partner !== null && focusIndex === partner){
    focusIndex = start;
    applyFocus();
  }else{
    pendingDirection = 'prev';
    pageFlip.flipPrev();
  }
  fadeNavHint();
}

function initFlip(){
  const wrap = document.getElementById('bookWrap');
  const w = Math.max(wrap.clientWidth, 320);
  const h = Math.max(wrap.clientHeight, 300);

  pageFlip = new St.PageFlip(bookEl, {
    width: w,
    height: h,
    size: 'stretch',
    minWidth: 280,
    maxWidth: 2400,
    minHeight: 260,
    maxHeight: 1600,
    maxShadowOpacity: 0.5,
    showCover: false,
    mobileScrollSupport: false,
    useMouseEvents: true,
    flippingTime: 900
  });
  pageFlip.loadFromHTML(document.querySelectorAll('.page'));

  pageFlip.on('flip', (e) => {
    const { start, partner } = pairOf(e.data);
    if(pendingDirection === 'prev' && partner !== null){
      focusIndex = partner;
    }else{
      focusIndex = start;
    }
    pendingDirection = null;
    applyFocus();
  });

  focusIndex = 0;
  applyFocus();
}

function runHandwriting(el){
  const quran = el.querySelector('[data-hw]');
  if(quran){
    const text = decodeURIComponent(quran.dataset.hw);
    quran.innerHTML = makeHandwriting(text);
    const trEl = el.querySelector('[data-tr]');
    if(trEl){
      trEl.textContent = trEl.dataset.tr;
      setTimeout(() => trEl.classList.add('show'), 1400);
    }
  }
  el.querySelectorAll('[data-hw2]').forEach((node) => {
    const text = node.dataset.hw2;
    node.innerHTML = makeHandwriting(text);
  });
}

function runAnthemLines(el){
  const lines = el.querySelectorAll('[data-hw3]');
  let cumulative = 0;
  lines.forEach((node) => {
    const text = node.dataset.hw3;
    setTimeout(() => { node.innerHTML = makeHandwriting(text); }, cumulative);
    cumulative += text.length*16 + 220;
  });
}

/* ============================================================
   7. KEYBOARD + INIT
============================================================ */
window.addEventListener('keydown', (e) => {
  if(!pageFlip) return;
  if(!startScreen.classList.contains('hidden')) return;
  if(e.key === 'ArrowRight') goNext();
  if(e.key === 'ArrowLeft') goPrev();
});

window.addEventListener('load', () => {
  if(window['St'] && St.PageFlip){
    initFlip();
  }else{
    const retry = setInterval(() => {
      if(window['St'] && St.PageFlip){
        clearInterval(retry);
        initFlip();
      }
    }, 150);
  }
});

/* ============================================================
   8. RESIZE / DISPLAY-CHANGE HANDLING
============================================================ */
let resizeDebounce;
function handleDisplayChange(){
  clearTimeout(resizeDebounce);
  resizeDebounce = setTimeout(() => {
    if(pageFlip){
      try{ pageFlip.update(); }catch(e){}
    }
  }, 200);
}
window.addEventListener('resize', handleDisplayChange);
window.addEventListener('orientationchange', handleDisplayChange);
if(screen.orientation && screen.orientation.addEventListener){
  screen.orientation.addEventListener('change', handleDisplayChange);
}
// catches the moment a projector/second display actually connects and the OS resizes the window
if('matchMedia' in window){
  window.matchMedia('(resolution: 1dppx)').addEventListener?.('change', handleDisplayChange);
}
